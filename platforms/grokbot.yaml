# Platform profile: Grok Bot. UNTESTED: written from a plan, never run.
muster_core: ">=0.3.4"
status: untested
install: "bot template + skills library + setup prompt with question buttons (see docs/grokbot.html)"
plugin_root: "skills library: muster-*"
commands: { board: "background job: board-digest" }
roles:
  manager:          { home: owner_chat }
  builder:          { home: teammate_bot }
  designer:         { home: teammate_bot }
  inspector:        { home: background_job }
  design_inspector: { home: background_job }
reports: { end_of_turn_reply: six_line_report }
choices: question_buttons
renewal_handovers: off
archive: hide_from_sidebar
messages: { default: held, wake_on: [order, READY, PASS, FAIL, STUCK, NEED] }
crew_files: "a Muster folder outside the project's history"
updates: { check: routine_weekly, deliver: bundled_note_per_role }
