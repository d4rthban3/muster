# Free test (GitHub's standard runners only, no secrets): on every push, install Muster from the pushed branch and run
# setup's own steps headless on a fresh Windows, Mac and Linux computer. It cannot press the desktop app's buttons.
name: setup-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leak scan (this branch's history only)
        run: bash scripts/scan-leaks.sh
      - name: Plugin check (claude plugin validate --strict; the JSON check only if claude cannot be installed)
        run: |
          if npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && command -v claude >/dev/null; then
            echo "CHECK RAN: claude plugin validate --strict"
            claude plugin validate . --strict
          else
            echo "CHECK RAN: the JSON and field check (claude could not be installed here)"
            python3 scripts/check-json.py
          fi
      - name: Each worker's one page is current and short (build-pages.py)
        run: python3 scripts/build-pages.py --check
      - name: The directory edition is current and holds only allowed files (build-directory.py)
        run: |
          python3 scripts/build-directory.py --check
          python3 scripts/build-directory.py --verify
          python3 scripts/build-directory.py --selftest
      - name: Test files are listed (check-tests.py)
        run: python3 scripts/check-tests.py .
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the claude command
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Muster from this branch
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install muster@muster-kit --scope user
          claude plugin list --json > "$RUNNER_TEMP/plugins.json"
          cat "$RUNNER_TEMP/plugins.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).find(x=>x.id==="muster@muster-kit");if(!p||!p.enabled){process.exit(1)}console.log(p.installPath)' "$RUNNER_TEMP/plugins.json" > "$RUNNER_TEMP/installpath.txt"
          claude plugin validate "$GITHUB_WORKSPACE"
      - name: Run setup's steps from the installed copy
        run: |
          INSTALLED=$(cat "$RUNNER_TEMP/installpath.txt")
          test -f "$INSTALLED/scripts/setup-smoke.sh"
          bash "$INSTALLED/scripts/setup-smoke.sh"
  rust:
    # builds the checks program for every system, runs its own tests, and uploads the ready-built copies
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc, exe: muster-checks.exe}
          - {os: macos-latest, name: macos-arm64, target: aarch64-apple-darwin, exe: muster-checks}
          - {os: macos-latest, name: macos-x86_64, target: x86_64-apple-darwin, exe: muster-checks}
          - {os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-gnu, exe: muster-checks}
          - {os: ubuntu-24.04-arm, name: linux-arm64, target: aarch64-unknown-linux-gnu, exe: muster-checks}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the build target
        run: rustup target add ${{ matrix.target }}
      - name: Rust tests
        working-directory: checks
        run: cargo test --locked
      - name: Build the ready-made copy
        working-directory: checks
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: muster-checks-${{ matrix.name }}
          path: checks/target/${{ matrix.target }}/release/${{ matrix.exe }}
  shipped-copies:
    # the committed ready-made copies must be the ones built from this source, and must pass every carried-over self-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, dir: windows-x86_64, exe: muster-checks.exe}
          - {os: macos-latest, dir: macos-arm64, exe: muster-checks}
          - {os: ubuntu-latest, dir: linux-x86_64, exe: muster-checks}
          - {os: ubuntu-24.04-arm, dir: linux-arm64, exe: muster-checks}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The copies match the source
        run: python3 scripts/source-stamp.py --check
      - name: Every carried-over self-test passes against the shipped copy
        run: |
          BIN="$GITHUB_WORKSPACE/bin/${{ matrix.dir }}/${{ matrix.exe }}"
          test -f "$BIN"
          chmod +x "$BIN" || true
          MUSTER_CHECKS_BIN="$BIN" python3 scripts/rules-check-selftest.py
          MUSTER_CHECKS_BIN="$BIN" python3 scripts/profile-selftest.py
